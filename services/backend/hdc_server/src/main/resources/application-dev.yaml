server:
  servlet:
    context-path: /hdc/api
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/hdc?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    max-lifetime: 600000

mqtt:
  url: tcp://127.0.0.1
  port: 31883
  enabled: true
factory:
  mqtt:
    enabled: true
  persistence:
    enabled: true
logging:
  level:
    #spring根日志级别
#    root: info
    #spring web日志级别
    web: debug
    #项目日志级别
#    com.fu.easycode: info
    #SQL日志打印
    com.archermind.hdc.mapper: debug
  charset:
    #控制台编码
    console: UTF-8
file:
  path: E:\hdc_runtime\files\hdc
  url: http://localhost:8088/files/hdc/
