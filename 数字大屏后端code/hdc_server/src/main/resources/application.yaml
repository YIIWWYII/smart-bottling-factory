server:
  port: 8088
spring:
  application:
    name: hdc
  profiles:
    active: @profileActive@
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  sql:
    init:
      encoding: utf-8
      mode: always
      platform: all
      schema-locations: classpath:sql/mysql.sql,classpath:sql/factory.sql
      username: root
      password: 123456
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰下划线映射开启
    map-underscore-to-camel-case: true
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delete_flag
      logic-delete-value: 1
      logic-not-delete-value: 0
knife4j:
  enable: true
  basic:
    enable: true
    username: admin
    password: admin
  setting:
    enable-swagger-models: true
    swagger-model-name: 实体类列表
    enable-version: false
    enableHomeCustom: true
    homeCustomLocation: classpath:markdown/readme.md
